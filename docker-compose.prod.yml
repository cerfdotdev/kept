services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: "no"
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "apps/worker/dist/migrate-entry.js"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE}
    restart: unless-stopped
    env_file: [.env]
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5g

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: [.env]
    init: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/uploads
      - escrow:/escrow
    deploy:
      resources:
        limits:
          memory: 768m

  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  backup:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/backups
    environment:
      BACKUP_HOST: db
      BACKUP_USER: ${POSTGRES_USER}
      BACKUP_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 3 * * * PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h $$BACKUP_HOST -U $$BACKUP_USER -d $$BACKUP_DB -Fc -f /backups/kept-$$(date +\%Y\%m\%d).dump && find /backups -name '*.dump' -mtime +14 -delete" > /tmp/crontab.txt
        crontab /tmp/crontab.txt
        echo "backup cron installed (nightly 03:00 UTC, 14-day retention)"
        crond -f -l 2

volumes:
  db-data:
  uploads:
  escrow:
  backups:
