name: Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with: { version: 10.14.0 }
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter worker typecheck
      - run: pnpm --filter worker test
      - name: Verify Dockerfiles compile
        run: |
          docker build -f Dockerfile.web --build-arg NEXT_PUBLIC_APP_URL=https://kept.dok.cerf.codes --build-arg NEXT_PUBLIC_DEMO_MODE=true -t kept-web:ci .
          docker build -f Dockerfile.worker -t kept-worker:ci .

  deploy:
    needs: verify-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Dokploy deploy
        run: |
          curl -fsS -X POST "https://dokploy.cerf.codes/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -d "{\"composeId\": \"${{ secrets.DOKPLOY_COMPOSE_ID }}\", \"title\": \"${{ github.sha }}\"}"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://kept.dok.cerf.codes/api/health || true)
            if [ "$code" = "200" ]; then echo "health OK"; exit 0; fi
            sleep 20
          done
          echo "health check failed after 10 minutes" >&2
          exit 1
